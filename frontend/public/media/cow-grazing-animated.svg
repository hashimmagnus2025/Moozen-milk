<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="A cow grazing on a green pasture">
  <title>Grazing cow</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ecf8"/>
      <stop offset="1" stop-color="#f7f4e8"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcf5a"/>
      <stop offset="1" stop-color="#5fa83a"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M300 192 C300 166 330 160 385 160 L585 160 C640 160 666 186 666 238 C666 288 640 322 590 324 L360 324 C322 324 300 302 300 262 Z"/>
    </clipPath>
  </defs>

  <style>
    .cloud { animation: drift 28s linear infinite; }
    .cloud.slow { animation-duration: 42s; animation-delay: -12s; }
    @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(60px); } }

    .head { transform-box: view-box; transform-origin: 340px 200px; animation: graze 3.2s ease-in-out infinite; }
    @keyframes graze {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(4deg); }
      55% { transform: rotate(-2deg); }
    }
    .chew { animation: chew 0.55s ease-in-out infinite; }
    @keyframes chew { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3.5px); } }

    .mouthGrass { transform-box: fill-box; transform-origin: 50% 100%; animation: munch 0.55s ease-in-out infinite; }
    @keyframes munch { 0%, 100% { transform: rotate(-6deg) scaleY(1); } 50% { transform: rotate(6deg) scaleY(0.82); } }

    .tail { transform-box: view-box; transform-origin: 662px 196px; animation: swish 2.4s ease-in-out infinite; }
    @keyframes swish { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-9deg); } }

    .ear { transform-box: fill-box; transform-origin: 0% 50%; animation: flick 4.2s ease-in-out infinite; }
    @keyframes flick { 0%, 86%, 100% { transform: rotate(0deg); } 90% { transform: rotate(-18deg); } 94% { transform: rotate(4deg); } }

    .bell { transform-box: fill-box; transform-origin: 50% 0%; animation: ring 1.6s ease-in-out infinite; }
    @keyframes ring { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-8deg); } }

    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

    .tuft { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite; }
    .tuft:nth-of-type(2n) { animation-duration: 3.7s; animation-delay: -1s; }
    .tuft:nth-of-type(3n) { animation-duration: 2.6s; animation-delay: -1.8s; }
    @keyframes sway { 0%, 100% { transform: skewX(-4deg); } 50% { transform: skewX(4deg); } }

    .breathe { transform-box: view-box; transform-origin: 480px 324px; animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Sky + scenery -->
  <rect width="800" height="520" fill="url(#sky)"/>
  <g class="cloud" fill="#fff" opacity="0.9">
    <ellipse cx="150" cy="80" rx="52" ry="20"/><ellipse cx="190" cy="68" rx="38" ry="22"/><ellipse cx="118" cy="72" rx="30" ry="16"/>
  </g>
  <g class="cloud slow" fill="#fff" opacity="0.8">
    <ellipse cx="640" cy="120" rx="46" ry="16"/><ellipse cx="672" cy="108" rx="32" ry="18"/><ellipse cx="610" cy="114" rx="26" ry="13"/>
  </g>
  <path d="M0 330 C140 270 260 290 400 320 C540 350 660 290 800 310 L800 520 L0 520 Z" fill="#a9d97a"/>
  <path d="M0 370 C160 330 320 350 460 372 C600 392 700 350 800 360 L800 520 L0 520 Z" fill="url(#field)"/>

  <!-- Fence -->
  <g fill="#b9824a">
    <rect x="40" y="318" width="9" height="62" rx="2"/><rect x="150" y="320" width="9" height="62" rx="2"/>
    <rect x="690" y="312" width="9" height="62" rx="2"/><rect x="760" y="316" width="9" height="62" rx="2"/>
    <rect x="30" y="334" width="150" height="8" rx="3"/><rect x="30" y="356" width="150" height="8" rx="3"/>
    <rect x="680" y="328" width="110" height="8" rx="3"/><rect x="680" y="350" width="110" height="8" rx="3"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="480" cy="446" rx="230" ry="13" fill="#2f6b2a" opacity="0.28"/>

  <!-- Far legs -->
  <g fill="#d6d6da">
    <path d="M372 305 L398 305 L395 424 L376 424 Z"/>
    <path d="M566 305 L592 305 L589 424 L570 424 Z"/>
  </g>
  <g fill="#3a3340">
    <path d="M375 424 h20 v14 a5 5 0 0 1 -5 5 h-10 a5 5 0 0 1 -5 -5 z"/>
    <path d="M569 424 h20 v14 a5 5 0 0 1 -5 5 h-10 a5 5 0 0 1 -5 -5 z"/>
  </g>

  <!-- Tail -->
  <g class="tail">
    <path d="M662 196 C690 206 698 250 692 318" fill="none" stroke="#f3eee6" stroke-width="8" stroke-linecap="round"/>
    <path d="M692 306 C680 324 681 350 692 364 C704 350 706 324 692 306 Z" fill="#2d2830"/>
  </g>

  <!-- Body -->
  <g class="breathe">
    <path d="M300 192 C300 166 330 160 385 160 L585 160 C640 160 666 186 666 238 C666 288 640 322 590 324 L360 324 C322 324 300 302 300 262 Z" fill="#fbf7ef"/>
    <g clip-path="url(#bodyClip)" fill="#2d2830">
      <path d="M400 160 C450 160 480 190 462 226 C444 256 396 246 388 212 C382 186 386 164 400 160 Z"/>
      <path d="M560 160 C620 160 680 176 680 222 C680 256 632 246 604 232 C572 216 540 184 560 160 Z"/>
      <path d="M470 282 C510 266 560 280 552 312 C544 340 482 346 466 316 C460 300 460 290 470 282 Z"/>
      <path d="M296 262 C326 252 352 270 344 300 C336 322 298 318 294 290 Z"/>
    </g>
    <!-- Udder -->
    <path d="M524 322 C522 352 560 352 560 322 Z" fill="#f4a9b0"/>
    <path d="M532 346 v9 M552 346 v9" stroke="#e98e98" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Near legs -->
  <g fill="#fbf7ef">
    <path d="M330 305 L358 305 L354 424 L334 424 Z"/>
    <path d="M598 305 L626 305 L622 424 L602 424 Z"/>
  </g>
  <g fill="#2d2830">
    <path d="M333 424 h22 v14 a5 5 0 0 1 -5 5 h-12 a5 5 0 0 1 -5 -5 z"/>
    <path d="M601 424 h22 v14 a5 5 0 0 1 -5 5 h-12 a5 5 0 0 1 -5 -5 z"/>
  </g>

  <!-- Head + neck (grazing) -->
  <g class="head">
    <path d="M340 164 C292 168 264 205 254 250 C244 285 224 316 207 348 C198 366 198 386 214 392 C234 398 252 388 260 372 C274 346 292 332 314 326 L342 322 L352 190 Z" fill="#fbf7ef"/>
    <!-- Head patch -->
    <path d="M300 182 C274 196 260 226 254 252 C246 282 232 302 224 322 C250 318 276 292 288 262 C298 238 306 210 300 182 Z" fill="#2d2830"/>
    <!-- Horn + ear -->
    <path d="M276 232 C268 214 274 200 286 194 C286 210 284 220 290 232 Z" fill="#e9dcc2"/>
    <g class="ear">
      <ellipse cx="286" cy="252" rx="28" ry="11" transform="rotate(8 286 252)" fill="#2d2830"/>
      <ellipse cx="288" cy="253" rx="19" ry="6.5" transform="rotate(8 288 253)" fill="#f4a9b0"/>
    </g>
    <!-- Eye -->
    <g class="blink">
      <ellipse cx="243" cy="296" rx="9" ry="10" fill="#fff"/>
      <circle cx="242" cy="298" r="5.5" fill="#2d2830"/>
      <circle cx="240" cy="295" r="1.9" fill="#fff"/>
    </g>
    <!-- Collar + bell -->
    <path d="M268 292 C284 312 304 322 326 320" fill="none" stroke="#8a5a32" stroke-width="12" stroke-linecap="round"/>
    <g class="bell">
      <path d="M290 322 h20 l4 18 h-28 z" fill="#f5a623"/>
      <circle cx="300" cy="342" r="3.4" fill="#a8680a"/>
    </g>
    <!-- Muzzle (chews) -->
    <g class="chew">
      <ellipse cx="217" cy="380" rx="27" ry="19" transform="rotate(24 217 380)" fill="#f4a9b0"/>
      <ellipse cx="206" cy="372" rx="4" ry="5.5" transform="rotate(24 206 372)" fill="#c97a86"/>
      <path d="M222 396 C232 398 242 394 249 388" fill="none" stroke="#c97a86" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <!-- Grass in mouth -->
    <g class="mouthGrass" stroke="#4f9a2c" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M214 398 C208 416 204 428 200 438"/>
      <path d="M228 400 C228 416 230 428 234 438"/>
      <path d="M242 394 C250 410 258 422 268 430"/>
    </g>
  </g>

  <!-- Foreground grass -->
  <path d="M0 450 C120 436 260 452 400 448 C540 444 680 454 800 440 L800 520 L0 520 Z" fill="#6cb644"/>
  <g stroke-linecap="round" fill="none">
    <g class="tuft" stroke="#3f8a24" stroke-width="6"><path d="M130 470 l-12 -42 M130 470 l4 -48 M130 470 l16 -40"/></g>
    <g class="tuft" stroke="#4f9a2c" stroke-width="6"><path d="M260 480 l-12 -44 M260 480 l2 -50 M260 480 l14 -42"/></g>
    <g class="tuft" stroke="#3f8a24" stroke-width="6"><path d="M380 474 l-10 -40 M380 474 l4 -46 M380 474 l14 -38"/></g>
    <g class="tuft" stroke="#4f9a2c" stroke-width="6"><path d="M520 482 l-12 -42 M520 482 l2 -48 M520 482 l14 -40"/></g>
    <g class="tuft" stroke="#3f8a24" stroke-width="6"><path d="M650 472 l-10 -40 M650 472 l4 -46 M650 472 l14 -38"/></g>
    <g class="tuft" stroke="#4f9a2c" stroke-width="6"><path d="M740 484 l-10 -38 M740 484 l4 -44 M740 484 l12 -36"/></g>
  </g>
  <g fill="#fff"><circle cx="90" cy="500" r="4"/><circle cx="330" cy="505" r="3.5"/><circle cx="590" cy="500" r="4"/></g>
  <g fill="#f5a623"><circle cx="90" cy="500" r="1.6"/><circle cx="330" cy="505" r="1.4"/><circle cx="590" cy="500" r="1.6"/></g>
</svg>
